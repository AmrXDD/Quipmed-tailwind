<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-logo-main.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo-secondary-black.png" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0b" />
    <meta name="description" content="QuipMed — procurement, distribution and development of advanced medical equipment for healthcare facilities in Kuwait." />
    <meta property="og:title" content="QuipMed · Leading Medical Innovation" />
    <meta property="og:description" content="Procurement, distribution and development of advanced medical equipment for healthcare facilities in Kuwait." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quipmed.co" />
    <title>QuipMed · Leading Medical Innovation</title>
    <link rel="preload" as="image" href="/logo-secondary-black.png" crossorigin="anonymous" />
    <style>
      /* ── Preloader ──────────────────────────────────────────────
         The wordmark is drawn twice through a CSS mask: a faint ghost
         and a solid fill that grows downward behind a scan line, so the
         logo is "scanned" into place. On exit the logo flies into the
         nav and the panel wipes upward. Driven by the script below. */
      html { background: #0b0c0b; }
      html.theme-white { background: #fafaf8; }
      html[data-preloading] [data-nav-logo] { opacity: 0; }
      #preloader {
        --pl-bg: #0b0c0b;
        --pl-ink: #ffffff;
        --pl-muted: rgba(244, 245, 242, 0.42);
        --pl-ghost: rgba(244, 245, 242, 0.1);
        --pl-scan: #8fd4a6;
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }
      html.theme-white #preloader {
        --pl-bg: #fafaf8;
        --pl-ink: #050708;
        --pl-muted: rgba(11, 12, 11, 0.5);
        --pl-ghost: rgba(11, 12, 11, 0.08);
        --pl-scan: #1f7a45;
      }
      #preloader .pl-bg {
        position: absolute;
        inset: 0;
        background: var(--pl-bg);
        pointer-events: auto;
        clip-path: inset(0 0 0 0);
        transition: clip-path 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #preloader.is-leaving .pl-bg { clip-path: inset(0 0 100% 0); pointer-events: none; }
      #preloader .pl-logo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(46vw, 280px);
        aspect-ratio: 1284 / 656;
        transform: translate(-50%, -50%);
        transform-origin: 0 0;
        will-change: transform;
      }
      #preloader .pl-logo > i {
        position: absolute;
        inset: 0;
        -webkit-mask: url("/logo-secondary-black.png") center / contain no-repeat;
        mask: url("/logo-secondary-black.png") center / contain no-repeat;
      }
      #preloader .pl-ghost { background: var(--pl-ghost); }
      #preloader .pl-fill {
        background: var(--pl-ink);
        clip-path: inset(0 0 calc(100% - var(--p, 0%)) 0);
      }
      #preloader .pl-line {
        position: absolute;
        left: -14%;
        right: -14%;
        top: var(--p, 0%);
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--pl-scan) 18%, var(--pl-scan) 82%, transparent);
        box-shadow: 0 0 14px 1px var(--pl-scan);
        transition: opacity 0.3s ease;
      }
      #preloader.is-scanned .pl-line { opacity: 0; }
      #preloader .pl-meta {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 28px;
        display: flex;
        justify-content: space-between;
        font: 500 11px/1 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--pl-muted);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.3s ease;
      }
      #preloader.is-scanned .pl-meta { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-bg { transition: opacity 0.4s ease; }
        #preloader.is-leaving .pl-bg { clip-path: none; opacity: 0; }
        #preloader .pl-line { display: none; }
      }
    </style>
    <script>
      /* Click inspector — only with ?debug=clicks in the address.
         Outlines whatever is under the cursor, names it, and reports what
         each click actually landed on. Invisible to normal visitors. */
      (function () {
        if (location.search.indexOf("debug=clicks") === -1) return;
        var box, panel, last = "none yet";
        var build = "";
        function describe(el) {
          if (!el) return "nothing";
          var s = el.tagName.toLowerCase();
          if (el.id) s += "#" + el.id;
          var c = (el.getAttribute("class") || "").trim().split(/\s+/).slice(0, 5).join(".");
          if (c) s += "." + c;
          var a = el.closest && el.closest("a,button");
          s += a ? "\n    inside " + a.tagName.toLowerCase() + ": " + (a.getAttribute("href") || a.textContent.trim().slice(0, 40)) : "\n    (not inside a link or button)";
          return s;
        }
        function ensure() {
          if (box) return;
          box = document.createElement("div");
          box.style.cssText = "position:fixed;pointer-events:none;z-index:2147483647;outline:2px solid #ff3b30;background:rgba(255,59,48,.10)";
          panel = document.createElement("pre");
          panel.style.cssText = "position:fixed;left:10px;bottom:10px;z-index:2147483647;pointer-events:none;margin:0;max-width:min(680px,92vw);white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:#000;color:#7CFC00;padding:10px 12px;border-radius:8px;box-shadow:0 0 0 1px #333";
          document.documentElement.append(box, panel);
          var s = [].slice.call(document.scripts).map(function (x) { return x.src; }).filter(function (x) { return x.indexOf("/assets/") > -1; })[0] || "";
          build = s.split("/").pop();
        }
        function render(under) {
          panel.textContent =
            "QUIPMED CLICK INSPECTOR  ·  " + location.host + location.pathname + "  ·  " + build +
            "\nUNDER CURSOR: " + under +
            "\nLAST CLICK:   " + last +
            "\nUA: " + navigator.userAgent.slice(0, 120);
        }
        document.addEventListener("pointermove", function (e) {
          ensure();
          var el = document.elementFromPoint(e.clientX, e.clientY);
          if (!el) return;
          var r = el.getBoundingClientRect();
          box.style.left = r.left + "px"; box.style.top = r.top + "px";
          box.style.width = r.width + "px"; box.style.height = r.height + "px";
          render(describe(el));
        }, true);
        ["pointerdown", "mousedown", "click"].forEach(function (type) {
          window.addEventListener(type, function (e) {
            ensure();
            last = type + " -> " + describe(e.target).replace(/\n\s+/g, "  |  ") + "  (button=" + e.button + ", pointer=" + (e.pointerType || "-") + ")";
            render("(move the mouse)");
          }, true);
        });
        window.addEventListener("click", function (e) {
          last += "  [cancelled by page: " + e.defaultPrevented + "]";
          if (panel) render("(move the mouse)");
        }, false);
      })();
    </script>
    <script>
      /* One canonical address. www.quipmed.co and quipmed.co are separate
         origins (separate logins and storage), so send www to the bare
         domain. "_w" breaks any loop if the host ever redirects back. */
      (function () {
        var l = location;
        if (l.hostname === "www.quipmed.co" && l.search.indexOf("_w=1") === -1) {
          var q = l.search ? l.search + "&_w=1" : "?_w=1";
          l.replace("https://quipmed.co" + l.pathname + q + l.hash);
        } else if (l.search.indexOf("_w=1") !== -1 && history.replaceState) {
          var clean = l.search.replace(/[?&]_w=1/, "").replace(/^&/, "?");
          history.replaceState(null, "", l.pathname + clean + l.hash);
        }
      })();
    </script>
    <script>
      (function () {
        var d = document.documentElement;
        try {
          if (localStorage.getItem("theme") === "light") d.classList.add("theme-white");
        } catch (e) {}
        d.setAttribute("data-preloading", "");
      })();
    </script>
  </head>
  <body class="bg-navy-800 text-white antialiased">
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <div id="preloader" aria-hidden="true">
      <div class="pl-bg"></div>
      <div class="pl-logo">
        <i class="pl-ghost"></i>
        <i class="pl-fill"></i>
        <span class="pl-line"></span>
      </div>
      <div class="pl-meta"><span>QuipMed&nbsp;&nbsp;/&nbsp;&nbsp;Kuwait</span><span id="pl-pct">000</span></div>
    </div>
    <script>
      /* Preloader controller.
         Progress is real: each stage the app reports (app mounted, hero
         asset ready) raises the target; a gentle time creep keeps it
         moving, and a hard cap guarantees the site is never held back. */
      (function () {
        var root = document.getElementById("preloader");
        if (!root) return;
        var d = document.documentElement;
        var logo = root.querySelector(".pl-logo");
        var pct = document.getElementById("pl-pct");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var seen = false;
        try { seen = sessionStorage.getItem("quipmed.preloaded") === "1"; } catch (e) {}

        var start = performance.now();
        var MIN = reduce ? 200 : seen ? 650 : 1600; // ms on screen at minimum
        var MAX = 5000;                                // never block longer than this
        var needHero = location.pathname === "/";
        var stages = { dom: false, app: false, hero: !needHero };
        var shown = 0;
        var finished = false;

        function target() {
          var t = 8;
          if (stages.dom) t += 22;
          if (stages.app) t += 35;
          if (stages.hero) t += 35;
          var creep = Math.min(88, ((performance.now() - start) / MAX) * 100);
          var all = stages.dom && stages.app && stages.hero;
          return all ? 100 : Math.max(Math.min(t, 96), creep);
        }

        function done() {
          if (finished) return;
          finished = true;
          window.__quipmedPreloader.done = true;
          try { sessionStorage.setItem("quipmed.preloaded", "1"); } catch (e) {}
          root.classList.add("is-scanned");

          var navLogo = document.querySelector("[data-nav-logo] img");
          var from = logo.getBoundingClientRect();
          var to = navLogo && navLogo.getBoundingClientRect();
          var canFly = !reduce && to && to.width > 0 && to.top < window.innerHeight;

          setTimeout(function () {
            if (canFly) {
              var s = to.width / from.width;
              logo.style.transition = "transform 0.95s cubic-bezier(0.76, 0, 0.24, 1)";
              logo.style.transform = "translate(" + to.left + "px," + to.top + "px) scale(" + s + ")";
              // Re-anchor the logo to the viewport origin so the transform above is absolute.
              logo.style.left = "0";
              logo.style.top = "0";
            } else {
              logo.style.transition = "opacity 0.4s ease";
              logo.style.opacity = "0";
            }
            root.classList.add("is-leaving");
            window.dispatchEvent(new Event("quipmed:preloader-leave"));
          }, reduce ? 0 : 260);

          // Hand-off: the flight ends at ~1.21s. Show the real nav logo
          // (no fade, same spot, same colour), then remove the flying copy
          // two frames later so there is never a frame with no logo.
          // Timers, not animation frames, so a busy GPU can't hold this up.
          setTimeout(function () {
            d.removeAttribute("data-preloading");
            setTimeout(function () {
              if (root.isConnected) root.remove();
              window.dispatchEvent(new Event("quipmed:preloader-done"));
            }, 40);
          }, reduce ? 450 : 1280);
        }

        // Pin the logo to absolute pixel coordinates before flying so the
        // translate() above starts from where it is drawn now.
        function pinLogo() {
          var r = logo.getBoundingClientRect();
          logo.style.left = "0";
          logo.style.top = "0";
          logo.style.transform = "translate(" + r.left + "px," + r.top + "px)";
        }

        function tick() {
          if (finished) return;
          var t = target();
          shown += (t - shown) * 0.085;
          if (t - shown < 0.4) shown = t;
          root.style.setProperty("--p", shown.toFixed(2) + "%");
          logo.style.setProperty("--p", shown.toFixed(2) + "%");
          pct.textContent = String(Math.round(shown)).padStart(3, "0");
          var elapsed = performance.now() - start;
          if ((shown >= 100 && elapsed >= MIN) || elapsed >= MAX + 600) {
            pinLogo();
            // let the pinned position apply before transitioning
            setTimeout(done, 34);
            return;
          }
          requestAnimationFrame(tick);
        }

        // Failsafes that don't depend on animation frames: if frames stall
        // (busy GPU, background tab), still leave, and never stay on top.
        setTimeout(function () {
          if (!finished) { pinLogo(); done(); }
        }, MAX + 1200);
        setTimeout(function () {
          if (root.isConnected) {
            d.removeAttribute("data-preloading");
            root.remove();
            window.dispatchEvent(new Event("quipmed:preloader-done"));
          }
        }, MAX + 4500);

        window.__quipmedPreloader = {
          done: false,
          mark: function (stage) { stages[stage] = true; },
        };
        if (document.readyState !== "loading") stages.dom = true;
        else document.addEventListener("DOMContentLoaded", function () { stages.dom = true; });
        setTimeout(function () { stages.hero = true; stages.app = true; }, MAX);
        requestAnimationFrame(tick);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
