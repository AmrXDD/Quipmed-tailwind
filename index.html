<!doctype html>
<html lang="en" class="bg-navy-800">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-logo-main.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo-secondary-black.png" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A192F" />
    <meta name="description" content="QuipMed — Leading Medical Innovation. Procurement, distribution, and development of advanced medical equipment for healthcare facilities." />
    <title>QuipMed · Leading Medical Innovation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0A192F;
        color: #e5f2ff;
        font-family: "Outfit", system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .splash-ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 2px solid rgba(100, 255, 218, 0.15);
        border-top-color: #64ffda;
        animation: splash-spin 0.85s linear infinite;
      }
      #app-splash .splash-label {
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(229, 242, 255, 0.6);
      }
      #app-splash .splash-brand {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #64ffda;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-navy-800 text-white antialiased">
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-ring"></div>
      <div class="splash-brand">QuipMed</div>
      <div class="splash-label">Loading</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
